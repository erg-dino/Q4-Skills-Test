<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-box { max-width: 350px; margin: 100px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="login-box text-center">
        <h2>Login</h2> <p>Enter your details below.</p> <input type="text" id="user" class="form-control mb-3" placeholder="Username">
        <input type="password" id="pass" class="form-control mb-3" placeholder="Password">

        <div class="form-check text-start mb-3">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <button class="btn btn-primary w-100" onclick="validate()">Login</button>
    </div>
</div>

<script>
    var correctUser = "PNEUMOULTRAMICROSCOPICSILICOVOLCANOCONIOSIS";
    var correctPass = "XAVLEG";

    function validate() {
        var u = document.getElementById("user").value;
        var p = document.getElementById("pass").value;

       
        if (u == correctUser && p == correctPass) {
            window.location.href = "notebooks.html";  
        } else {
            alert("Invalid Username or Password"); 
        }
    }
</script>

</body>
</html>
