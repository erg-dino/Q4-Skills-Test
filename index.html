<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgb(52, 52, 171);
        }
    </style>
</head>
<body>
<br><br><br>

<div class="container d-flex justify-content-center align-items-center" style="margin: auto">
    <div class="p-5 mt-5 shadow-lg login-box"
      style="width: 500px; background: rgba(195, 197, 204, 0.35); color:  rgb(123, 255, 0); border-radius: 20px;">
    <form>
        <h2>Login Form</h2>
        <label for="user">Username</label>
            <br>
            <input type="text" id="user" class="form-control" placeholder="Enter here" required>
            <br>  


        <label for="pass">Password</label>
            <br>
            <input type="password" id="pass" class="form-control" placeholder="Enter here" required>
            <br> 
        
        <p id="display"></p>


        <input type="button" name="button" id="loginBTN" value="Login" class="btn btn-info rounded-5" onclick="authenticate()">


         <input type="reset" name="button" id="cancel" value="Cancel" class="btn btn-info rounded-5" >
    </form>
</div>


    <script>
        let attempt_counter = 0;


        function authenticate(){
            let username = document.getElementById("user").value;
            let pass = document.getElementById("pass").value;
            let granted = "Welcome " + username + "!";
            let denied = "Access denied. Account locked after 3 attempts!";


        while (attempt_counter < 3) {
        if (username === "pneumoultramicroscopicsilicovolcanoconiosis" && pass === "xavlegG!&19") {
            alert(granted);
            attempt_counter = 0; // reset attempts after successful login
            document.getElementById("display").innerHTML = "";
            window.location.href = "notebooks.html";


            break; // stop loop
        }


        else {
            attempt_counter++;
            document.getElementById("display").innerHTML =
                "Incorrect username and/or password. Attempt " + attempt_counter + " of 3 ";
            break; // stop loop for this click
        }


        }
        if (attempt_counter >= 3) {
                alert(denied);
                document.getElementById("loginBTN").disabled = true; // disable button
            }
        }
    </script>
    
</body>
</html>
