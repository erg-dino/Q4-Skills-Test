<!DOCTYPE html>
<html>
<head>
    <title>Virtual Notebooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            background-color: rgb(150, 150, 205);
            min-height: 100vh;
        }
        .cards{
             display: flex;
             flex-wrap: wrap;
            gap: 10px;
        }
          .card-img {
            background: #ffffff;
            height: 80px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #ccc;
        }
         .notebook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
         .row {
            background: #e2e2e2;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-flex flex-column">
            <h4 class="mb-4">Menu</h4>
            <ul class="mb-4">
                <li class="mb-3">Dashboard</li>
                <li class="mb-3" style="font-weight: bold;">Virtual Notebooks</li>
                <li class="mb-3">Tasks</li>
                <li class="mb-3">Profile</li>
            </ul>
            <a href="index.html" class="btn mt-auto" style="border: 3px solid white;">Logout</a>
        </div>

        <div class="col-md-10 p-4">
            <h1 class="mb-4">NOTEBOOKS</h1>
            <p class="text-secondary mb-4">Select a subject to view your notes.</p>

            <div class="notebook-grid">
                <div class="row">
                    <h5 class="fw-bold m-0">Social Studies</h5>
                    <div class="card-img"></div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Ms. Francisco</small>
                </div>

                <div class="row">
                    <h5 class="col">English</h5>
                    <div class="card-img"></div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Ms. Avila</small>
                </div>

                <div class="row">
                    <h5 class="col">Math</h5>
                    <div class="card-img"></div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Mr. Verba</small>
                </div>

                <div class="row">
                    <h5 class="col">Science</h5>
                    <div class="card-img">I</div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Ms. Mendaro</small>
                </div>

                <div class="row">
                    <h5 class="col">Filipino</h5>
                    <div class="card-img"></div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Mr. Reynoso</small>
                </div>

                <div class="row">
                    <h5 class="col">V.E</h5>
                    <div class="card-img">Image Placeholder</div>
                    <small class="d-block">9E</small>
                    <small class="text-secondary">Mr. Buntile</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
